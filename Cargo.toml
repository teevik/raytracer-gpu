[workspace]
resolver = "3"
members = ["runner", "shader"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.dependencies]
# rust-gpu. Keep cargo-gpu-install and spirv-std on the same version.
cargo-gpu-install = "0.10.0"
spirv-std = "0.10.0"

# math
bytemuck = { version = "1.25", features = ["derive"] }
# Must be the glam that spirv-std re-exports (spirv-std 0.10 -> glam 0.33), so only one version
# ends up in the graph. spirv-std adds `std` on the host and `libm` on the SPIR-V target.
glam = { version = "0.33", default-features = false, features = ["bytemuck", "u32"] }

# host
wgpu = { version = "30.0", features = ["spirv"] }
pollster = { version = "1.0", features = ["macro"] }
env_logger = "0.11"
rand = "0.10"
anyhow = "1.0"

obvhs = "0.4"
png = "0.18.1"
