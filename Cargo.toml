[workspace]
resolver = "3"
members = ["runner", "shader"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[workspace.dependencies]
# rust-gpu. Keep cargo-gpu-install and spirv-std on the same version.
cargo-gpu-install = "0.11.0"
spirv-std = "0.11.0"

# math
bytemuck = { version = "1.25", features = ["derive"] }
# Must match the glam spirv-std re-exports (spirv-std 0.11 -> glam 0.34)
glam = { version = "0.34", default-features = false, features = ["bytemuck", "u32"] }

# host
wgpu = { version = "30.0", features = ["spirv"] }
pollster = { version = "1.0", features = ["macro"] }
env_logger = "0.11"
rand = "0.10"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
indicatif = "0.18"

obvhs = "0.4"
png = "0.18.1"
